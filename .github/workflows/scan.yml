name: skan
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skan
  cancel-in-progress: false
jobs:
  skan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - id: scan
        run: dart run bin/scan.dart
      - name: zapis i powiadomienie
        run: |
          if [ -n "$(git status --porcelain signals.json)" ]; then
            git config user.name "skaner"
            git config user.email "skaner@users.noreply.github.com"
            git add signals.json
            git commit -q -m "skan $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q
            if [ "${{ steps.scan.outputs.events }}" != "0" ]; then
              curl -s -X POST -H 'Content-Type: application/json' \
                -d "{\"sha\":\"$(git rev-parse HEAD)\"}" https://oszczednosci.myhome-jagatowo.pl/api/notify
            fi
          fi
